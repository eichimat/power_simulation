[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power_simulation"
version = "0.1.0"
description = "A short, descriptive summary of your project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core dependencies required to run your application
dependencies = [
    "fusion_solar_py",
    "plotly",
    "pandas",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.0.0"
]


[project.urls]
"Homepage" = "https://github.com"
"Bug Tracker" = "https://github.com/issues"

# Configure your testing tools directly inside this file
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

